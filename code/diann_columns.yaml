levels:
  precursor:
    var:
      - File.Name # entire file path
      - Run # basename
    obs:
      - Protein.Group # parsimony protein group
      - Protein.Ids
      - Protein.Names
      - Genes
      - All Mapped Proteins
      - All Mapped Genes
    pr_obs:
      - Modified.Sequence
      - Stripped.Sequence
      - Precursor.Id
      - Precursor.Charge
      - Lib.Index
      - IM
      - iIM
      - Predicted.IM
      - Predicted.iIM
      - M:15.9949
      - M:15.9949 Best Localization
      - M:15.9949 Best Scan
      - STY:79.96633
      - STY:79.96633 Best Localization
      - STY:79.96633 Best Scan
      - n:42.0106
      - n:42.0106 Best Localization
      - n:42.0106 Best Scan
    x:
      - Q.Value
      - PEP
      - Global.Q.Value
      - Translated.Q.Value
      - Proteotypic
      - Precursor.Quantity
      - Precursor.Normalised
      - Precursor.Translated
      - Translated.Quality
      - Ms1.Translated
      - Quantity.Quality
      - RT
      - RT.Start
      - RT.Stop
      - iRT
      - Predicted.RT
      - Predicted.iRT
      - Lib.Q.Value # FDR based on library evidence alone (sample vs libary spectra, better quant if good lib.qval)
      - Ms1.Profile.Corr
      - Ms1.Area
      - Evidence
      - Spectrum.Similarity
      - Averagine
      - Mass.Evidence
      - CScore
      - Decoy.Evidence
      - Decoy.CScore
      - Fragment.Quant.Raw
      - Fragment.Quant.Corrected
      - Fragment.Correlations
      - MS2.Scan
      - Precursor.Mz
      - Fragment.Info
       
    optional:

    
  peptide:
    required:
      - PeptideSequence
      - ProteinGroups
      - Intensity
      - Condition
      - BioReplicate
    optional:
      - NumPSMs
      - RT_mean
      - RT_std
      
  protein:
    required:
      - ProteinID
      - Intensity
      - Condition
      - BioReplicate
      - Run
    optional:
      - GeneNames
      - NumPeptides
      - Coverage
      
  msstats:
    required:
      - ProteinName
      - PeptideSequence
      - PrecursorCharge
      - FragmentIon
      - ProductCharge
      - IsotopeLabelType
      - Condition
      - BioReplicate
      - Run
      - Intensity
    optional:
      - Fraction
      - TechReplicate

# Rename mappings for different formats
column_mappings:
  fragpipe:
    Intensity: "Intensity"
    ProteinID: "Protein ID"
    PeptideSequence: "Peptide"
    
  maxquant:
    Intensity: "Intensity"
    ProteinID: "Protein IDs"
    PeptideSequence: "Sequence"
    
  diann:
    Intensity: "Precursor.Quantity"
    ProteinID: "Protein.Group"
    PeptideSequence: "Stripped.Sequence"