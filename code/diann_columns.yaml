# Column configurations for different analysis levels

levels:
  precursor:
    var:
      - File.Name # entire file path
      - Run # basename
    obs:
      - Protein.Group # parsimony protein group
      - Protein.Ids
      - Protein.Names
      - Genes
      - All Mapped Proteins
      - All Mapped Genes
      - Modified.Sequence
      - Stripped.Sequence
      - Precursor.Id
      - Precursor.Charge
      - Lib.Index
    layers:
      - Precursor.Quantity
      - Precursor.Normalised
      - IM
      - iIM
      - Predicted.IM
      - Predicted.iIM
      - Precursor.Mz
      - Proteotypic
      - iRT
      - Predicted.RT
      - Predicted.iRT
      - Q.Value # within run FDR 
      - PEP
      - Global.Q.Value # FDR across all runs reflects MBR; < 0.01 == 1% FDR
      - Translated.Q.Value
      - Precursor.Translated
      - Translated.Quality
      - Ms1.Translated
      - Quantity.Quality
      - RT
      - RT.Start
      - RT.Stop
      - Lib.Q.Value # FDR based on library evidence alone (sample vs libary spectra, better quant if good lib.qval)
      - Ms1.Profile.Corr
      - Ms1.Area
      - Evidence
      - Spectrum.Similarity
      - Averagine
      - Mass.Evidence
      - CScore
      - Decoy.Evidence
      - Decoy.CScore
      - Fragment.Quant.Raw
      - Fragment.Quant.Corrected
      - Fragment.Correlations
      - MS2.Scan
      - Fragment.Info

# Label.Ratio	
    
    # mod_obs:
    #   - {residue:mass_shift}
    #   - {residue:mass_shift} Best Localization
    #   - {residue:mass_shift} Best Scan

  protein:
    var:
      - File.Name # entire file path
      - Run # basename
    obs:
      - Protein.Ids
      - Protein.Group
      - Protein.Names
      - Genes
      
    pr_obs:
      - Modified.Sequence
      - Stripped.Sequence
      - Precursor.Id
    layers:
      - PG.MaxLFQ
      - PG.Quantity
      - PG.Normalised
      - Lib.PG.Q.Value
      - Protein.Q.Value
      - Global.PG.Q.Value
      - PG.Q.Value

  gene:
    obs:
      - Genes
    var:
      - File.Name # entire file path
      - Run # basename
    layers:
      - Genes.MaxLFQ
      - Genes.Quantity
      - Genes.Normalised
      - Genes.MaxLFQ.Unique
      - GG.Q.Value


